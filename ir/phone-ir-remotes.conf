# Named IR codes for `phone-ir send NAME` (and `phone-ir list`).
# Installed to /etc/phone-ir/remotes.conf — edit it there; the installer
# never overwrites an existing file.
#
# One definition per line:  NAME = KIND ARGS...   (numbers: decimal or 0x..)
#   nec ADDR CMD                 NEC, 8-bit address and command
#   necext ADDR16 CMD            NEC with a 16-bit address
#   samsung ADDR CMD             Samsung32
#   sirc ADDR CMD                Sony SIRC, 12-bit (sent three times)
#   rc5 ADDR CMD                 Philips RC5 (toggle bit flips per press)
#   raw CARRIER_HZ DUTY_PCT MARK SPACE ...   raw timings in microseconds
#   ref OTHER_NAME               send another name's codes
# A name on several lines sends all of them, one after another (150 ms apart).
#
# Codes for many devices are published in the Flipper-IRDB
# (github.com/Lucaslhm/Flipper-IRDB). Flipper's NEC/Samsung32/SIRC/RC5 entries
# map directly: its "address"/"command" bytes are the ADDR/CMD values here
# (NECext: the two address bytes, low byte first, make up ADDR16 high:low).
#
# Examples (uncomment and adapt):
#   lg-power      = nec 0x04 0x08
#   samsung-power = samsung 0x07 0x02
#   sony-power    = sirc 0x01 0x15
