# SMSC (SMS message center) for outgoing SMS, as SMSC=<number>.
# This modem sends nothing without an explicit SMSC — none is stored on
# the SIM where ModemManager would pick it up. The number is
# operator/SIM-specific: find yours from the SIM's EF_SMSP record or
# your operator's documentation, then set it below.
#SMSC=+xxxxxxxxxxx
