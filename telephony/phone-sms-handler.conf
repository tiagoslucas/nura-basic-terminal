# What happens to each SMS the modem receives: COMMAND is run as a
# shell command with SMS_NUMBER, SMS_TEXT, SMS_TIMESTAMP and SMS_FILE in
# its environment — SMS_FILE is a volatile JSON copy of the message
# under /tmp/sms/, named uniquely by its content. Exit 0 means handled
# and the SMS is deleted from modem storage; any other outcome leaves
# it in the modem inbox, where sms-handler retries it on every scan.
#
# Forward each SMS to another phone (sms-send, installed alongside;
# replace the placeholder with the destination number):
#COMMAND=$HOME/.local/bin/sms-send +15551234567 "FWD from $SMS_NUMBER: $SMS_TEXT"
