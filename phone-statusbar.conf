# Status bar tunables — /etc/phone-statusbar.conf
#
# KEY=value lines, times in seconds; '#' starts a comment. Unknown keys
# and malformed values are ignored (the built-in default is used).
# Changes take effect at the next service restart:
#   doas systemctl restart phone-statusbar
#
# *** BATTERY: raising either value saves power, at the cost of slower
# *** updates. Each value controls how often something wakes up.

# How long a modem query (mmcli) result is cached. This is the expensive
# part of a repaint — every fetch is a D-Bus round-trip that wakes
# ModemManager. 300 s = 288 queries/day, 900 s = 96/day. The tradeoff:
# the signal % and tech label (4G/5G/…) can be this stale.
MODEM_EVERY=300

# While the screen is dark, how often the daemon wakes to check whether
# the backlight came back on by itself (screen-on via the power button
# pokes it instantly, so this is only a safety net). 30 s = 2 wakes/min
# while dark; 60 s halves that. No visible tradeoff unless a wake path
# that bypasses phone-screen-toggle is ever used.
POLL_EVERY=30
