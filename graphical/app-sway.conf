# Kiosk sway config for app: no bar, no idle blanking, black
# background, 3x output scale (1080x2280 physical -> 360x760 logical),
# everything driven by touch. The app + wvkbd come from app-inner;
# the command is passed via $PHONE_APP_CMD env.
output DSI-1 scale 3
output * bg #000000 solid_color
exec /usr/local/bin/app-inner
