# Kiosk sway config for app: no idle blanking, black background, 3x
# output scale (1080x2280 physical -> 360x760 logical), everything
# driven by touch. The app + wvkbd come from app-inner; the command is
# passed via $PHONE_APP_CMD env.
output DSI-1 scale 3
output * bg #000000 solid_color

# No window borders/title bar: the app is the only window, fullscreen
default_border none

# Status bar: the same info as the console phone-statusbar (cellular,
# battery, clock, RING/CALL), fed to sway's built-in bar in --text mode.
# 32 logical px = 96 physical, the height of the fbcon bar (covers the
# notch). Black bar, white text, like the console one. swaybar runs as
# root (sway is root in this kiosk) but crashes without the user bus, so
# swaybar_command drops it to tiagol first.
bar {
    swaybar_command /usr/local/bin/swaybar-user
    position top
    height 32
    font "monospace 12"
    status_command /usr/local/bin/phone-statusbar --text
    workspace_buttons no
    colors {
        background #000000
        statusline #ffffff
    }
}

exec /usr/local/bin/app-inner
