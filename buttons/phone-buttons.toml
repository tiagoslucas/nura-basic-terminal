# Power button: toggle screen (and keyboard visibility) without logging out.
# Volume buttons: while a call rings, up answers and down silences the
# ringer; otherwise console font size (see /usr/local/bin/phone-volume).
# ttyescape's vol-down + power combo is preserved by guards inside the
# scripts (see /usr/local/bin/phone-*).
[[events]]
name = "screen toggle"
event_type = "EV_KEY"
key_state = "released"
keys = ["KEY_POWER"]
command = "/usr/local/bin/phone-screen-toggle"

[[events]]
name = "volume up (answer while ringing)"
event_type = "EV_KEY"
key_state = "released"
keys = ["KEY_VOLUMEUP"]
command = "/usr/local/bin/phone-volume up"

[[events]]
name = "volume down (mute ringer while ringing)"
event_type = "EV_KEY"
key_state = "released"
keys = ["KEY_VOLUMEDOWN"]
command = "/usr/local/bin/phone-volume down"
