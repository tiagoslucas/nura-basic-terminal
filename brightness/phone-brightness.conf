# Adaptive backlight tunables — /etc/phone-brightness.conf
#
# KEY=value lines, times in seconds; '#' starts a comment. Unknown keys
# and malformed values are ignored (the built-in default is used).
# Changes take effect at the next service restart:
#   doas systemctl restart phone-brightness
#
# The mapping is logarithmic: MIN_BRIGHTNESS in the dark, MAX_BRIGHTNESS
# at LUX_MAX ambient light, smooth in between.

# Backlight level for a dark room (and the floor never gone below).
# Lower = dimmer night screen, easier on the eyes and battery.
MIN_BRIGHTNESS=60

# Backlight level at LUX_MAX ambient light. Defaults to the panel
# maximum. Lower it if direct sunlight is brighter than you ever want.
MAX_BRIGHTNESS=4095

# Ambient light (lux) that maps to MAX_BRIGHTNESS. Indoor rooms are
# roughly 100-500 lux, overcast outdoor ~1000, direct sun >10000.
LUX_MAX=10000

# *** BATTERY: how often the sensor is sampled while the screen is on.
# Each sample is a cheap sysfs read (plus an occasional backlight write);
# raising this to 10 halves the wakes. While the screen is off the
# daemon sleeps and samples nothing. The tradeoff is how quickly the
# screen reacts when you walk between rooms.
POLL_EVERY=5
